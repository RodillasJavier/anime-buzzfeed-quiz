<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Anime/Manga Character Quiz</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>

    <body>
        <div id="header">
            <img class="header-image" src="./media/guts.png" alt="Guts Resting">
            <h1 class="header-title">What Anime Character are you?</h1>
        </div>

        <section id="quiz">
                
            <!-- QUESTION 1 -->
            <div class="question-container">

                <h2 class="question-title">Of the following, what is your favorite beverage to have with a meal?</h2>

                <div class="answer-choice-container">

                    <label class="answer-choice">
                        <img src="media/q1/coffee.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="Coffee">
                        <p class="label">Coffee</p>
                    </label>
                    
                    <label class="answer-choice">
                        <img src="media/q1/tea.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="Tea">
                        <p class="label">Tea</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q1/mate.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="Mate">
                        <p class="label">Mate</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q1/soda.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="Soda">
                        <p class="label">Soda</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q1/juice.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="Juice">
                        <p class="label">Juice</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q1/water.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="Water">
                        <p class="label">Water</p>
                    </label>

                </div>

            </div>

        </section>

        <section id="results">

            <button id="get-results-button">Done!</button>

            <div id="result-modal" class="modal">
                <div class="modal-content">
                    <p id="results-text">Results!</p>
                    <span class="close">&times;</span>
                </div>
            </div>

        </section>

        <script
            src="https://code.jquery.com/jquery-3.3.1.min.js"
            integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
            crossorigin="anonymous">
        </script>
        <script src="main.js"></script>
    </body>

</html>
