<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Anime/Manga Character Quiz</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>

    <body>
        <div id="header">
            <img class="header-image" src="./media/gutsbg.png" alt="Guts Resting">
            <h1 class="header-title">What Anime Character are you?</h1>
        </div>

        <section id="quiz">
                
            <!-- QUESTION 1 -->
            <div class="question-container">

                <h2 class="question-title">What is your go-to beverage?</h2>

                <div class="answer-choice-container">

                    <label class="answer-choice">
                        <img src="media/q1/protein.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="1">
                        <p class="answer-label">Protein Shake</p>
                    </label>
                    
                    <label class="answer-choice">
                        <img src="media/q1/boba.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="2">
                        <p class="answer-label">Boba Tea</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q1/tea.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="3">
                        <p class="answer-label">Tea</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q1/soda.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="4">
                        <p class="answer-label">Soda</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q1/coffee.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="5">
                        <p class="answer-label">Black Coffee</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q1/water.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="6">
                        <p class="answer-label">Water</p>
                    </label>

                </div>

            </div>

            <!-- QUESTION 2 -->
            <div class="question-container">

                <h2 class="question-title">What's your favorite type of meal after a long day?</h2>

                <div class="answer-choice-container">

                    <label class="answer-choice text">
                        <input type="radio" name="favorite_meal" value="1">
                        <h3 class="answer-choice-text">All you can eat buffet</h3>
                    </label>
                    
                    <label class="answer-choice text">
                        <input type="radio" name="favorite_meal" value="2">
                        <h3 class="answer-choice-text">Sushi and some sake</h3>
                    </label>

                    <label class="answer-choice text">
                        <input type="radio" name="favorite_meal" value="3">
                        <h3 class="answer-choice-text">Something homemade</h3>
                    </label>

                    <label class="answer-choice text">
                        <input type="radio" name="favorite_meal" value="4">
                        <h3 class="answer-choice-text">A big steak dinner</h3>
                    </label>

                    <label class="answer-choice text">
                        <input type="radio" name="favorite_meal" value="5">
                        <h3 class="answer-choice-text">I don't care, I'm not picky</h3>
                    </label>

                    <label class="answer-choice text">
                        <input type="radio" name="favorite_meal" value="6">
                        <h3 class="answer-choice-text">Microwave Meals</h3>
                    </label>

                </div>

            </div>

            <!-- QUESTION 3 -->
            <div class="question-container">

                <h2 class="question-title">If you could have one power, which would it be?</h2>

                <div class="answer-choice-container">

                    <label class="answer-choice">
                        <img src="media/q3/muscle.png" class="answer-choice-image">
                        <input type="radio" name="superpower" value="1">
                        <p class="answer-label">Inhuman Strength</p>
                    </label>
                    
                    <label class="answer-choice">
                        <img src="media/q3/eye.png" class="answer-choice-image">
                        <input type="radio" name="superpower" value="2">
                        <p class="answer-label">Enhanced senses</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q3/crossed_swords.png" class="answer-choice-image">
                        <input type="radio" name="superpower" value="3">
                        <p class="answer-label">Ability to wield any weapon</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q3/runner.png" class="answer-choice-image">
                        <input type="radio" name="superpower" value="4">
                        <p class="answer-label">Super speed</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q3/face_with_head_bandage.png" class="answer-choice-image">
                        <input type="radio" name="superpower" value="5">
                        <p class="answer-label">Accelerated recovery</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q3/boxing_glove.png" class="answer-choice-image">
                        <input type="radio" name="superpower" value="6">
                        <p class="answer-label">Ability to use any martial art</p>
                    </label>

                </div>

            </div>

            <!-- QUESTION 4 -->
            <div class="question-container">

                <h2 class="question-title">What motivates you the most?</h2>

                <div class="answer-choice-container">

                    <label class="answer-choice text">
                        <input type="radio" name="motivation" value="1">
                        <h3 class="answer-choice-text">Testing my own limits</h3>
                    </label>
                    
                    <label class="answer-choice text">
                        <input type="radio" name="motivation" value="2">
                        <h3 class="answer-choice-text">Making the world a better place</h3>
                    </label>

                    <label class="answer-choice text">
                        <input type="radio" name="motivation" value="3">
                        <h3 class="answer-choice-text">Helping family + friends</h3>
                    </label>

                    <label class="answer-choice text">
                        <input type="radio" name="motivation" value="4">
                        <h3 class="answer-choice-text">Having fun and being free</h3>
                    </label>

                    <label class="answer-choice text">
                        <input type="radio" name="motivation" value="5">
                        <h3 class="answer-choice-text">Finding my own purpose</h3>
                    </label>

                    <label class="answer-choice text">
                        <input type="radio" name="motivation" value="6">
                        <h3 class="answer-choice-text">Going on new adventures</h3>
                    </label>

                </div>

            </div>

            <!-- QUESTION 5 -->
            <div class="question-container">

                <h2 class="question-title">What is your favorite way to spend a day off?</h2>

                <div class="answer-choice-container">

                    <label class="answer-choice">
                        <img src="media/q5/workout.png" class="answer-choice-image">
                        <input type="radio" name="day_off" value="1">
                        <p class="answer-label">Work out</p>
                    </label>
                    
                    <label class="answer-choice">
                        <img src="media/q5/eat.png" class="answer-choice-image">
                        <input type="radio" name="day_off" value="2">
                        <p class="answer-label">Eat with friends</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q5/hike.png" class="answer-choice-image">
                        <input type="radio" name="day_off" value="3">
                        <p class="answer-label">Take a hike!</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q5/wander.png" class="answer-choice-image">
                        <input type="radio" name="day_off" value="4">
                        <p class="answer-label">See new places</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q5/meditate.png" class="answer-choice-image">
                        <input type="radio" name="day_off" value="5">
                        <p class="answer-label">Meditation + Relaxation</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/q5/sleep.png" class="answer-choice-image">
                        <input type="radio" name="day_off" value="6">
                        <p class="answer-label">Sleeping all day</p>
                    </label>

                </div>

            </div>      
            
            <!-- QUESTION 6 -->
            <div class="question-container">

                <h2 class="question-title">Where are you napping the hardest?</h2>

                <div class="answer-choice-container">

                    <label class="answer-choice">
                        <img src="media/q6/green.png" class="answer-choice-image">
                        <input type="radio" name="nap" value="1">
                    </label>
                    
                    <label class="answer-choice">
                        <img src="media/q6/tower_room.png" class="answer-choice-image">
                        <input type="radio" name="nap" value="2">
                    </label>

                    <label class="answer-choice">
                        <img src="media/q6/hammock.png" class="answer-choice-image">
                        <input type="radio" name="nap" value="3">
                    </label>

                    <label class="answer-choice">
                        <img src="media/q6/nature_bed.png" class="answer-choice-image">
                        <input type="radio" name="nap" value="4">
                    </label>

                    <label class="answer-choice">
                        <img src="media/q6/dark_bed.png" class="answer-choice-image">
                        <input type="radio" name="nap" value="5">
                    </label>

                    <label class="answer-choice">
                        <img src="media/q6/dark_couch.png" class="answer-choice-image">
                        <input type="radio" name="nap" value="6">
                    </label>

                </div>

            </div>      

        </section>

        <section id="results">

            <button id="get-results-button">Done!</button>

            <div id="result-modal" class="modal">
                <div class="modal-content">
                    <p id="results-text">Results!</p>
                    <span class="close">&times;</span>
                </div>
            </div>

        </section>

        <script
            src="https://code.jquery.com/jquery-3.3.1.min.js"
            integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
            crossorigin="anonymous">
        </script>
        <script src="main.js"></script>
    </body>

</html>
