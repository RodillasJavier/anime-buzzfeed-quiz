<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Italian Brainrot Quiz</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>

    <body>
        <div id="header">
            <img class="header-image" src="./media/italy.png" alt="Italian Port">
            <h1 class="header-title">What Italian Brainrot character are you?</h1>
        </div>

        <section id="quiz">
                
            <div class="question-container">

                <h2 class="question-title">Of the following, what is your favorite beverage?</h2>

                <div class="answer-choice-container">

                    <label class="answer-choice">
                        <img src="media/coffee.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="Coffee">
                        <p class="label">Coffee</p>
                    </label>
                    
                    <label class="answer-choice">
                        <img src="media/tea.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="Tea">
                        <p class="label">Tea</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/mate.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="Mate">
                        <p class="label">Mate</p>
                    </label>

                    <label class="answer-choice">
                        <img src="media/water.png" class="answer-choice-image">
                        <input type="radio" name="favorite_beverage" value="Water">
                        <p class="label">Water</p>
                    </label>

                </div>

            </div>

        </section>

        <section id="results">

            <button id="get-results-button">Done!</button>

            <div id="result-modal" class="modal">
                <div class="modal-content">
                    <p id="results-text">Results!</p>
                    <span class="close">&times;</span>
                </div>
            </div>

        </section>

        <script
            src="https://code.jquery.com/jquery-3.3.1.min.js"
            integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
            crossorigin="anonymous">
        </script>
        <script src="main.js"></script>
    </body>

</html>
